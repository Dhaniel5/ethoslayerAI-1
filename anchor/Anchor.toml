# Versions this was written against (NOT yet verified by a real build — see README):
#   anchor-lang / anchor-spl / Anchor CLI : 0.32.2
#   Solana (Agave) CLI                     : 2.3.0 (recommended by Anchor 0.32; see README for the v3 / Agave 4.3 step before mainnet)
[features]
resolution = true
skip-lint = false

# Placeholder IDs. Run `anchor keys sync` after the first `anchor build`.
[programs.localnet]
ethos_escrow = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
ethos_escrow = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[provider]
# Tests run against a local validator. Deploy to devnet explicitly with
# `--provider.cluster devnet`; never leave this pointing at a live cluster.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
